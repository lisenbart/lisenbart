<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500&family=Montserrat:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <!--
      Page title/description/og/twitter are injected per-route by react-helmet-async
      during vite-prerender-plugin (see src/prerender.tsx + SEO.tsx).
      Do not put route-agnostic description tags here — they duplicate and win for crawlers.
    -->
    <title>LISENBART FILM — Animation Studio for Brands, Games & Film</title>
    <link rel="canonical" href="https://lisenbart.com/" />
    <meta property="og:image" content="https://lisenbart.com/images/work/lisenbart-og-2026.jpg" />
    <meta property="og:image:secure_url" content="https://lisenbart.com/images/work/lisenbart-og-2026.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LISENBART FILM" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://lisenbart.com/images/work/lisenbart-og-2026.jpg" />
    <!-- GA4 loads only after optional analytics consent (see analyticsConsent.ts) -->
    <link rel="icon" href="%BASE_URL%favicon.svg?v=3" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%favicon.ico?v=3" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "LISENBART FILM",
        "alternateName": "LISENBART",
        "url": "https://lisenbart.com",
        "email": "info@lisenbart.com",
        "description": "Independent animation studio for brands, agencies and production partners. Creative development, direction and animation production since 2006. Original films and story IP.",
        "foundingDate": "2006",
        "founder": {
          "@type": "Person",
          "name": "Dmytro Lisenbart",
          "url": "https://lisenbart.com/about/"
        },
        "logo": {
          "@type": "ImageObject",
          "url": "https://lisenbart.com/images/black_logo.png"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "info@lisenbart.com",
          "contactType": "customer support",
          "availableLanguage": ["English", "Ukrainian"]
        },
        "sameAs": [
          "https://www.linkedin.com/in/lisenbart/",
          "https://www.youtube.com/@lisenbartProduction",
          "https://vimeo.com/849899875"
        ],
        "areaServed": ["Worldwide"],
        "knowsAbout": [
          "Animation production",
          "Creative direction",
          "Original animated films",
          "Game advertising"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Dmytro Lisenbart",
        "jobTitle": "Animation Director, Producer & Founder",
        "url": "https://lisenbart.com/about/",
        "email": "info@lisenbart.com",
        "worksFor": {
          "@type": "Organization",
          "name": "LISENBART FILM",
          "url": "https://lisenbart.com"
        },
        "sameAs": [
          "https://www.imdb.com/name/nm11412621/",
          "https://www.linkedin.com/in/lisenbart/"
        ]
      }
    </script>
    <script>
      (function () {
        try { localStorage.setItem("lisenbart-theme", "light"); } catch (e) {}
        document.documentElement.setAttribute("data-theme", "light");
      })();
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        width: 100%;
        max-width: 100%;
      }
      #root {
        min-height: 100%;
        width: 100%;
        max-width: 100%;
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <!-- Netlify Forms: static hooks for build-time detection (React submits via fetch) -->
    <form
      name="contact"
      method="POST"
      action="/"
      data-netlify="true"
      data-netlify-honeypot="website"
      hidden
    >
      <input type="hidden" name="form-name" value="contact" />
      <input type="email" name="email" />
      <input type="text" name="name" />
      <input type="text" name="projectType" />
      <textarea name="message"></textarea>
      <input type="text" name="page" />
      <input type="text" name="website" />
    </form>
    <form
      name="contact-games"
      method="POST"
      action="/"
      data-netlify="true"
      data-netlify-honeypot="website"
      hidden
    >
      <input type="hidden" name="form-name" value="contact-games" />
      <input type="email" name="email" />
      <input type="text" name="name" />
      <input type="text" name="projectType" />
      <textarea name="message"></textarea>
      <input type="text" name="page" />
      <input type="text" name="website" />
    </form>
    <form
      name="contact-ai"
      method="POST"
      action="/"
      data-netlify="true"
      data-netlify-honeypot="website"
      hidden
    >
      <input type="hidden" name="form-name" value="contact-ai" />
      <input type="email" name="email" />
      <input type="text" name="name" />
      <input type="text" name="projectType" />
      <textarea name="message"></textarea>
      <input type="text" name="page" />
      <input type="text" name="website" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
