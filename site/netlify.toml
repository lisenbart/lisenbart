[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Preview / branch deploys may render marked legal placeholders & draft policies.
# Production context must not set VITE_LEGAL_PREVIEW (unverified legal stays omitted).
[context.deploy-preview.environment]
  VITE_LEGAL_PREVIEW = "true"

[context.branch-deploy.environment]
  VITE_LEGAL_PREVIEW = "true"

# --- Hard-block compromised / WordPress paths (hack aftermath) ---
# Must stay ABOVE the SPA /* fallback so they are not soft-200 HTML.
[[redirects]]
  from = "/celana"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/celana/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/wp-admin"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/wp-admin/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/wp-content"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/wp-content/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/wp-includes"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/wp-includes/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/wp-login.php"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/xmlrpc.php"
  to = "/410.html"
  status = 410
  force = true

# Do NOT force-redirect /originals → /originals/ (or client-work):
# with force=true Netlify matches the slashed URL too and loops forever.
# Static dist/originals/index.html + client canonical redirect handle hubs.

# --- Originals slate: former project pages → hub anchors ---
